# /etc/nginx/sites-available/gestionrrhh.migestion.com.ar
# Certbot agrega solo el bloque HTTPS (443) y la redirección.
server {
    listen 80;
    listen [::]:80;
    server_name gestionrrhh.migestion.com.ar;

    root /var/www/gestionrrhh/public;
    index index.php;
    charset utf-8;

    # Documentos de legajo, certificados y logos
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    access_log /var/log/nginx/gestionrrhh.access.log;
    error_log  /var/log/nginx/gestionrrhh.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # CSS, JS, imágenes: cache de 7 días (tema.css lleva ?v= para forzar cambios)
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Nada de archivos ocultos (.env, .git) ni otros .php
    location ~ /\.(?!well-known).* { deny all; }
    location ~ \.php$ { return 404; }
}

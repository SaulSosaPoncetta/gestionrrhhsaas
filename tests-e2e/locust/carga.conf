# Escenario base de la prueba de carga (sin interfaz, con reportes)
# Uso:  locust --config carga.conf
# Cualquier valor se pisa por línea de comandos, por ejemplo:  locust --config carga.conf --users 100 --run-time 10m

locustfile = locustfile.py
host = http://127.0.0.1:8000

# 50 usuarios simultáneos, entrando de a 5 por segundo
users = 50
spawn-rate = 5
run-time = 5m

# Sin interfaz web: corre, imprime el resumen y deja los reportes
headless = true
html = reporte/reporte_carga.html
csv = reporte/carga
only-summary = true

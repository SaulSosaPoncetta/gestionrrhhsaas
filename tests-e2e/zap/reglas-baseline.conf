# Reglas del escaneo base (zap-baseline.py). Formato: ID<TAB>IGNORE|WARN|FAIL<TAB>(comentario)
# FAIL = si aparece, el escaneo se considera fallido. Por defecto todo es WARN.
10010	IGNORE	(Cookie No HttpOnly Flag: es XSRF-TOKEN, Laravel la deja legible a proposito para el JavaScript)
10020	FAIL	(Falta X-Frame-Options / proteccion contra clickjacking)
10021	FAIL	(Falta X-Content-Type-Options)
10038	FAIL	(Falta Content-Security-Policy)
10035	WARN	(Falta Strict-Transport-Security: en local es HTTP, en produccion con HTTPS se envia)
10037	FAIL	(El servidor revela su tecnologia en X-Powered-By)
10055	WARN	(CSP con unsafe-inline: pendiente mover el JavaScript en linea a archivos)
90022	FAIL	(Mensajes de error de la aplicacion visibles)
